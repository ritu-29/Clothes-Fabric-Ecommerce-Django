{%extends 'base.html'%}
{%block main%}
{%load static%}
{%include 'messages.html'%}

<main>
<div class="banner margin_bottom_150">
	<div class="container">
		<h1 class="title-font title-banner">Add Product</h1>
		<ul class="breadcrumb des-font">
			<li><a href=" {% static 'Home1.html' %} ">Home</a></li>
			<li class="active">Add Product</li>
		</ul>
	</div>
</div>

<section class="user-detail">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-10">
                <div class="user-detail-content border shadow-sm p-4 rounded bg-white">
                    <h3 class="text-center mb-4 text-primary">Product Detail</h3>
                    <p class="text-center text-muted mb-4">Please fill in your details to continue</p>
                    <form action="/product_form" method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="form-group mb-3">
                            <label for="id_state" class="form-label">Category</label>
                            <select
                                name="category"
                                id="id_state"
                                class="form-control rounded-pill"
                                required>
                                {% for s in categories %}
                                    <option value="{{ s.id }}">{{ s.cateName }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Address Field -->
                        <div class="form-group mb-3">
                            <div class="register-page__form-input-box">
                                <label for="name" class="form-label">Name</label>
                                <input
                            type="text"
                            class="form-control rounded-pill"
                            id="name"
                            name="name"
                            placeholder="Enter name"
                            required>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="price" class="form-label">Price</label>
                                <input
                            type="number"
                            class="form-control rounded-pill"
                            id="price"
                            name="price"
                            placeholder="Enter price"
                            required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="quantity" class="form-label">Qauntity</label>
                                <input
                            type="number"
                            class="form-control rounded-pill"
                            id="quantity"
                            name="quantity"
                            placeholder="Enter quantity"
                            required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea
                                class="form-control rounded-pill"
                                id="description"
                                name="description"
                                rows="3"
                                placeholder="Enter your address"
                                required
                                oninput="
                                    if (this.value.trim().length < 10) {
                                        this.setCustomValidity('Address must be at least 10 characters long');
                                        this.reportValidity();
                                    } else {
                                        this.setCustomValidity('');
                                        this.reportValidity();
                                    }">
                            </textarea>
                        </div>



                        <!-- Profile Image -->
                        <div class="form-group mb-3">
                            <label for="product_image" class="form-label">Product Image</label>
                            <input
                                type="file"
                                name="product_image"
                                id="product_image"
                                class="form-control-file"
                                accept="image/*"
                                required
                                oninput="
                                    const file = this.files[0];
                                    if (!file) {
                                        this.setCustomValidity('Profile image is required');
                                        this.reportValidity();
                                    } else {
                                        const validImageTypes = ['image/jpeg', 'image/png', 'image/gif'];
                                        if (!validImageTypes.includes(file.type)) {
                                            this.setCustomValidity('Only JPG, PNG, and GIF images are allowed');
                                            this.reportValidity();
                                        } else {
                                            this.setCustomValidity('');
                                            this.reportValidity();
                                        }
                                    }">
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-block w-100 py-2 rounded-pill shadow">
                                Submit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
    <br><br>
</main>
{%endblock%}
